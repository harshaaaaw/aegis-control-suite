[project]
name = "simforge"
version = "0.1.0"
description = "SIMFORGE: adversarial simulation + causal-invariant forging for enterprise agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "aegis-control",
    "causala",
    "evalforge",
    "run-replay",
    "agent-sentinel",
]

[project.scripts]
simforge = "simforge.cli:app"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff", "mypy", "bandit"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-ignore = ["B008"]
extend-select = ["E", "F", "I", "BLE", "SIM", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["evalforge", "agent_sentinel", "run_replay", "run_replay.models"]
ignore_missing_imports = true
allow_untyped_defs = true
disable_error_code = ["attr-defined", "import-untyped", "no-redef"]
[[tool.mypy.overrides]]
module = ["simforge.*"]
disable_error_code = ["valid-type", "misc", "return-value", "arg-type", "assignment", "index", "union-attr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
