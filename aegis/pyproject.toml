[project]
name = "aegis-control"
version = "0.1.0"
description = "AEGIS control plane: trust, govern, and prove enterprise agents."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.6",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "typer>=0.12",
    "run-replay>=1.0.0",
    "evalforge>=1.0.0",
    "agent-sentinel>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "bandit", "pip-audit"]

[project.scripts]
aegis = "aegis.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "playwright: marks tests that drive the live UI in a browser",
]
